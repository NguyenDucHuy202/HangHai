[pytest]
testpaths = tests
pythonpath = .
addopts = -v -ra --strict-markers
markers =
    unit: Standalone unit test using synthetic fixtures
    e2e: End-to-end integration test
    contracts: Schema and data contract validation
    graph: Graph topology, Dijkstra, and Yen routing
    algorithms: SNA algorithms (centrality, community, link prediction)
    app: Streamlit components and page smoke tests
